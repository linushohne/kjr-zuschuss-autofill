<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Zuschussliste</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Zuschussliste</h1>
        <span class="local">Alles bleibt auf diesem Gerät.</span>
      </header>

      <section class="setup" aria-label="Datei und Fahrt">
        <div class="file-row">
          <label class="file-button" for="file">Excel auswählen</label>
          <input id="file" class="file-input" type="file" accept=".xlsx,.xls">
          <span id="filename">Keine Datei ausgewählt</span>
          <button id="reset" type="button" class="text-button" hidden>Zurücksetzen</button>
        </div>
        <div class="trip-row">
          <label>Fahrtbeginn *<input id="start" type="date" required></label>
          <details>
            <summary>Weitere Angaben</summary>
            <div class="optional-fields">
              <label>Titel<input id="title" type="text" maxlength="160"></label>
              <label>Ort<input id="location" type="text" maxlength="160"></label>
              <label>Fahrtende<input id="end" type="date"></label>
            </div>
          </details>
        </div>
      </section>

      <p id="status" class="status" role="status" aria-live="polite"></p>
      <p id="error" class="error" role="alert" hidden></p>

      <section id="people" aria-label="Teilnehmende" hidden>
        <div class="filters">
          <label>Tabellenblatt<select id="sheet"></select></label>
          <label class="search">Suche<input id="search" type="search" placeholder="Name oder Adresse" autocomplete="off"></label>
          <label>Sippe<select id="group"><option value="">Alle</option></select></label>
          <label>Stufe<select id="level"><option value="">Alle</option></select></label>
          <label class="check"><input id="active" type="checkbox" checked>Nur aktive</label>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th class="select-cell"><input id="select-all" type="checkbox" aria-label="Alle angezeigten Personen auswählen"></th>
              <th>Name</th><th>Sippe</th><th>Alter</th><th>Adresse</th><th aria-label="Bearbeiten"></th>
            </tr></thead>
            <tbody id="rows"></tbody>
          </table>
          <p id="empty" class="empty" hidden>Keine Treffer.</p>
        </div>
        <footer class="download-bar">
          <span id="selection" aria-live="polite">0 ausgewählt</span>
          <button id="clear-selection" class="text-button" type="button" hidden>Auswahl leeren</button>
          <span id="download-hint" class="download-hint">Fahrtbeginn eintragen.</span>
          <button id="download" class="primary" type="button" disabled>Word herunterladen</button>
        </footer>
      </section>
      <noscript>Bitte JavaScript aktivieren.</noscript>
    </main>

    <dialog id="edit-dialog">
      <form id="edit-form">
        <h2>Angaben bearbeiten</h2>
        <label>Vorname<input id="edit-first" required maxlength="100"></label>
        <label>Nachname<input id="edit-last" required maxlength="100"></label>
        <label>Geburtstag<input id="edit-birthday" type="date" required></label>
        <label>Adresse<textarea id="edit-address" required rows="3" maxlength="400"></textarea></label>
        <div class="dialog-actions">
          <button id="edit-cancel" type="button">Abbrechen</button>
          <button class="primary" type="submit">Übernehmen</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
